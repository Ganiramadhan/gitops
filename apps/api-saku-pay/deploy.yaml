apiVersion: v1
kind: Namespace
metadata:
  name: saku-pay-staging
  labels:
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: saku-pay-quota
  namespace: saku-pay-staging
spec:
  hard:
    requests.cpu: "300m"
    requests.memory: "256Mi"
    limits.cpu: "800m"
    limits.memory: "512Mi"
    pods: "6"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: saku-pay-limitrange
  namespace: saku-pay-staging
spec:
  limits:
  - type: Container
    default:
      cpu: "150m"
      memory: "128Mi"
    defaultRequest:
      cpu: "50m"
      memory: "64Mi"
    max:
      cpu: "300m"
      memory: "256Mi"
---
# NOTE: Secret "saku-pay-secrets" is intentionally NOT tracked in Git (public repo).
# It's applied manually via kubectl and managed out-of-band from GitOps.
# Required keys: DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME, DB_SSLMODE,
# JWT_SECRET (>=32 chars), APP_ENCRYPTION_KEY (base64 of 32 bytes).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-saku-pay
  namespace: saku-pay-staging
  labels:
    app: api-saku-pay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-saku-pay
  template:
    metadata:
      labels:
        app: api-saku-pay
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "saku-pay-staging"
        vault.hashicorp.com/agent-inject-secret-.env: "secret/data/saku-pay-staging"
        vault.hashicorp.com/agent-inject-template-.env: |
          {{- with secret "secret/data/saku-pay-staging" -}}
          {{- range $k, $v := .Data.data }}
          {{ $k }}={{ $v }}
          {{- end }}
          {{- end }}
        vault.hashicorp.com/secret-volume-path-.env: "/app/envs"
        vault.hashicorp.com/agent-limits-cpu: "100m"
        vault.hashicorp.com/agent-limits-mem: "64Mi"
        vault.hashicorp.com/agent-requests-cpu: "20m"
        vault.hashicorp.com/agent-requests-mem: "32Mi"
    spec:
      imagePullSecrets:
      - name: registry-ganipedia
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api-saku-pay
        image: registry.ganipedia.com/api-saku-pay:15-eac7e47
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4000
        env:
        - name: APP_PORT
          value: "4000"
        - name: APP_ENV
          value: "staging"
        - name: CORS_ORIGINS
          value: "http://localhost:3000"
        - name: AUTO_MIGRATE
          value: "true"
        - name: DB_MAX_OPEN_CONNS
          value: "10"
        - name: DB_MIN_CONNS
          value: "1"
        - name: DB_CONN_MAX_LIFETIME
          value: "30"
        - name: JWT_TTL_HOURS
          value: "24"
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        readinessProbe:
          tcpSocket:
            port: 4000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 4000
          initialDelaySeconds: 15
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-saku-pay
  namespace: saku-pay-staging
spec:
  selector:
    app: api-saku-pay
  ports:
  - port: 4000
    targetPort: 4000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-saku-pay
  namespace: saku-pay-staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
  - host: api-saku.ganipedia.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-saku-pay
            port:
              number: 4000
  tls:
  - hosts: ["api-saku.ganipedia.com"]
    secretName: api-saku-pay-tls
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-saku-pay
  namespace: saku-pay-staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-saku-pay
  minReplicas: 1
  maxReplicas: 2
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-saku-pay-pdb
  namespace: saku-pay-staging
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-saku-pay
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: saku-pay-staging
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-traefik
  namespace: saku-pay-staging
spec:
  podSelector:
    matchLabels:
      app: api-saku-pay
  policyTypes: ["Ingress"]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: TCP
      port: 4000
